name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK (rilis + debug)
        run: gradle assembleRelease assembleDebug --no-daemon
      - name: Rapikan nama file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Duitku-Afief-Intan.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Duitku-Afief-Intan-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Duitku-APK
          path: dist/*.apk
